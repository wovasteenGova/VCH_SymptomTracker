<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" role="img" aria-label="Loading">
  <style>
    .vch-logo-loader__mark {
      transform-box: fill-box;
      transform-origin: center;
      animation: vch-logo-loader-pulse 2.4s ease-in-out infinite;
    }
    .vch-logo-loader__ring {
      fill: none;
      stroke: url(#vch-logo-loader-glow);
      stroke-width: 2.5;
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
      animation: vch-logo-loader-ring 2.4s ease-in-out infinite;
    }
    @keyframes vch-logo-loader-pulse {
      0%, 100% { opacity: 0.86; transform: scale(0.94); }
      50% { opacity: 1; transform: scale(1); }
    }
    @keyframes vch-logo-loader-ring {
      0%, 100% { opacity: 0; transform: scale(0.9); }
      50% { opacity: 0.5; transform: scale(1.08); }
    }
  </style>
  <defs>
    <linearGradient id="vch-logo-loader-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.45"/>
    </linearGradient>
  </defs>
  <circle class="vch-logo-loader__ring" cx="100" cy="100" r="88"/>
  <image class="vch-logo-loader__mark" href="/brand/vch-symptom-tracker-logo.png" x="24" y="24" width="152" height="152" preserveAspectRatio="xMidYMid meet"/>
</svg>
