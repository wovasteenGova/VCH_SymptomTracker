<!DOCTYPE html>
<html {{ HTML_ATTRS }}>
  <head>
    <style>
      #tracker-static-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 200;
        place-items: center;
        background: #131110;
        padding: 1rem;
      }

      /* Visibility lives on this node, not html.tracker-booting.
         Color-mode / Unhead replace <html class> (e.g. "dark") and used to
         hide this tank, then Vue painted a second one. */
      #tracker-static-splash.is-active {
        display: grid;
      }

      #tracker-static-splash .tracker-static-splash-inner {
        display: flex;
        width: min(28rem, 92vw);
        max-width: 32rem;
        flex-direction: column;
        align-items: center;
        gap: 1rem;
      }

      #tracker-static-splash .tracker-static-splash-brand {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.75rem;
      }

      #tracker-static-splash .tracker-static-splash-logo {
        width: 2.75rem;
        height: 2.75rem;
        border-radius: 9999px;
        object-fit: cover;
        object-position: center;
      }

      #tracker-static-splash .tracker-static-splash-wordmark {
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 2rem;
        font-weight: 600;
        line-height: 1;
        letter-spacing: 0.12em;
        color: #f2ead8;
      }

      #tracker-static-splash .tracker-static-splash-tank {
        width: 100%;
        user-select: none;
      }

      #tracker-static-splash.tracker-static-splash--leaving {
        opacity: 0;
        transition: opacity 0.5s ease;
        pointer-events: none;
      }
    </style>
    {{ HEAD }}
  </head>
  <body {{ BODY_ATTRS }}>
    <div id="tracker-static-splash" aria-hidden="true">
      <div class="tracker-static-splash-inner">
        <div class="tracker-static-splash-brand">
          <img
            class="tracker-static-splash-logo"
            src="/brand/vch-symptom-tracker-logo.png"
            alt=""
            decoding="async"
          >
          <span class="tracker-static-splash-wordmark">VCH</span>
        </div>
        <img
          class="tracker-static-splash-tank"
          src="/vch-tank-loader.svg"
          alt=""
          decoding="async"
        >
      </div>
    </div>
    <script>
      (function () {
        var splash = document.getElementById('tracker-static-splash')
        if (!splash) return
        var path = window.location.pathname
        if (path === '/' || path === '') {
          splash.classList.add('is-active')
          window.__trackerStaticSplashActive = true
        } else {
          splash.remove()
        }
      })()
    </script>
    {{ APP }}
  </body>
</html>
