<div
  class="vch-spa-loading-template"
  role="status"
  aria-live="polite"
  aria-label="Loading"
>
  <div class="vch-spa-loading-template__stack">
    <div class="vch-spa-loading-template__brand">
      <img
        class="vch-spa-loading-template__logo"
        src="/brand/vch-symptom-tracker-logo.png"
        alt="Veterans Central Hub"
        width="44"
        height="44"
        decoding="sync"
        fetchpriority="high"
      >
      <span class="vch-spa-loading-template__wordmark">VCH</span>
    </div>
    <img
      class="vch-spa-loading-template__tank"
      src="/vch-tank-loader.svg"
      alt=""
      aria-hidden="true"
      decoding="sync"
      fetchpriority="high"
    >
    <p
      class="vch-spa-loading-template__label"
      id="vch-spa-loader-label"
    ><span id="vch-spa-loader-caption"></span></p>
  </div>
</div>
<script>
  (function () {
    // Keep in sync with TRACKER_LOADER_SENTENCES in app/utils/trackerLoaderCopy.ts
    var sentences = [
      "Loading your symptom tracker…",
      "Pulling your logs together…",
      "Almost ready. Preparing Tracker…",
      "Getting your claim day tracking ready…",
      "We don't sell your data."
    ]
    var index = Math.floor(Math.random() * sentences.length)
    var sentence = sentences[index] || sentences[0]
    // Caption only — never copy sibling markup (dots / SVG / class= /
    // aria-hidden) into the visible status text.
    var caption = document.getElementById('vch-spa-loader-caption')
    var root = document.querySelector('.vch-spa-loading-template')
    if (caption) caption.textContent = sentence
    if (root) root.setAttribute('aria-label', sentence)
  })()
</script>
