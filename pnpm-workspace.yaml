allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  core-js: true
  esbuild: true
  vue-demi: true

overrides:
  dompurify: 3.4.13
  esbuild: 0.28.1
  nanoid: 3.3.18

# Kept for pnpm 10 local installs; pnpm 11 uses allowBuilds above.
onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@tailwindcss/oxide'
  - core-js
  - esbuild
  - vue-demi
