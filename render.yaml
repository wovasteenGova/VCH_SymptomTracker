services:
  - type: web
    name: vch-tracker
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: NITRO_PRESET
        value: node-server
      - key: APP_URL
        value: https://tracker.veteranscentralhub.com
      - key: NODE_ENV
        value: production
      # Required at build + runtime — set values in Render dashboard (see .env.example)
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLIC_KEY
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: REMINDER_CRON_SECRET
        sync: false

  - type: cron
    name: vch-tracker-reminder-cron
    runtime: node
    plan: starter
    region: oregon
    schedule: "0 * * * *"
    buildCommand: npm ci
    startCommand: node scripts/reminder-cron.mjs
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: APP_URL
        value: https://tracker.veteranscentralhub.com
      - key: REMINDER_CRON_SECRET
        sync: false
